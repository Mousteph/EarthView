name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/*.test.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  compose-smoke:
    name: Docker Compose smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create local API configuration
        run: cp config.example.yaml config.yaml
      - name: Build and start services
        run: docker compose up --build --detach
      - name: Check frontend and API health
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 20 --retry-delay 2 --retry-all-errors http://localhost:3000/
          curl --fail --silent --show-error --output /dev/null --retry 20 --retry-delay 2 --retry-all-errors http://localhost:3000/data
          docker compose exec --no-TTY api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      - name: Stop services
        if: always()
        run: docker compose down --volumes
